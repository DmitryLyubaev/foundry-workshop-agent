name: Live evaluation

# The CI smoke version of the study (spec §7, Review Focus 5): the frozen scenarios on the GPT
# engine, 1 pass, scored by Foundry's evaluators. It costs money, so it runs only by hand, only from
# main, and only in the protected live-eval environment: the CI identity's one federated credential
# trusts repo:<owner>/<repo>:environment:live-eval and nothing else, so a pull request, a fork or a
# job without the environment gets no Azure token. The full study (3 passes, both engines) runs
# locally per the runbook. tests/Workshop.Agent.Tests/WorkflowShapeTests.cs pins this file's shape.
on:
  workflow_dispatch:

# The OIDC token for azure/login, and read access to the code. Nothing else.
permissions:
  contents: read
  id-token: write

# One run at a time; a second waits rather than cancelling a paid run part-way.
concurrency:
  group: live-eval
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  live-eval:
    if: github.ref == 'refs/heads/main'
    environment: live-eval
    # WinForms needs Windows: the runner starts Workshop.App for each scenario.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # Transcripts, dataset, scores and report: everything that is scanned, then posted and uploaded.
      OUT_DIR: ${{ github.workspace }}/live-eval-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      # Built before the sign-in, so the Azure session is no longer than the paid steps need.
      - name: Build
        run: dotnet build -c Release

      - name: Install the evaluation package's dependencies
        run: python -m pip install -r eval/requirements.txt

      # OIDC: no client secret exists. Both the agent and the evaluation sign in through the Azure CLI
      # (AzureCliCredential), so this comes before either.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --frozen: no model is called unless scenarios/freeze.json matches the scenarios, instructions,
      # settings and tools. --passes 1: the smoke version; --study would run exactly 3. No --trace:
      # the trace export is for local runs, and --trace-content is never used with a frozen run.
      - name: Run the frozen scenarios on the GPT engine
        env:
          FWA_PROJECT_ENDPOINT: ${{ secrets.FWA_PROJECT_ENDPOINT }}
          FWA_RESOURCE_ENDPOINT: ${{ secrets.FWA_RESOURCE_ENDPOINT }}
          FWA_GPT_DEPLOYMENT: ${{ secrets.FWA_GPT_DEPLOYMENT }}
          FWA_CLAUDE_DEPLOYMENT: ${{ secrets.FWA_CLAUDE_DEPLOYMENT }}
        run: dotnet run --project src/Workshop.Agent -c Release --no-build -- run --engine gpt --frozen --passes 1 --scenarios scenarios --out "$env:OUT_DIR"

      # The judge is the GPT deployment (FWA_GPT_DEPLOYMENT). The report says this is a smoke run:
      # 1 pass on one engine is short of the study's count.
      - name: Score with Foundry's evaluators and write the report
        working-directory: eval
        env:
          FWA_PROJECT_ENDPOINT: ${{ secrets.FWA_PROJECT_ENDPOINT }}
          FWA_GPT_DEPLOYMENT: ${{ secrets.FWA_GPT_DEPLOYMENT }}
        run: |
          python -m fwa_eval eval "$env:OUT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m fwa_eval report "$env:OUT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Before anything leaves the runner. GitHub masks secrets in the log, not in an artifact or a
      # summary, and not a secret's fragments; so the patterns (tokens, URLs, hosts, GUIDs, emails,
      # keys) and the secrets' own values, hosts and resource names are looked for. A finding fails
      # the job, and neither the summary nor the upload runs. It runs after a failed step too, so the
      # transcripts of a failed run can still be uploaded once they are clean.
      - name: Scan the outputs for secrets
        id: scan
        if: ${{ !cancelled() }}
        working-directory: eval
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FWA_PROJECT_ENDPOINT: ${{ secrets.FWA_PROJECT_ENDPOINT }}
          FWA_RESOURCE_ENDPOINT: ${{ secrets.FWA_RESOURCE_ENDPOINT }}
        run: python -m fwa_eval.scan "$env:OUT_DIR" --literal-env AZURE_CLIENT_ID --literal-env AZURE_TENANT_ID --literal-env AZURE_SUBSCRIPTION_ID --literal-env FWA_PROJECT_ENDPOINT --literal-env FWA_RESOURCE_ENDPOINT

      - name: Post the report to the job summary
        if: ${{ !cancelled() && steps.scan.outcome == 'success' && hashFiles('live-eval-out/report.md') != '' }}
        run: Get-Content -Raw "$env:OUT_DIR/report.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload the outputs
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-eval-${{ github.run_number }}
          path: live-eval-out/
          if-no-files-found: error
          retention-days: 30
