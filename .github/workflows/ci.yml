name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    # WinForms needs Windows.
    runs-on: windows-latest
    # A hung UI-thread test would otherwise run to the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet build -c Release

      - run: dotnet test -c Release --no-build

  terraform:
    # Checks both stacks offline: no Azure credentials, no backend, mocked providers.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Set from a shell because a job-level env value is not expanded, and Terraform reads `~`
      # in this variable literally.
      - name: Provider plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/bootstrap/.terraform.lock.hcl', 'infra/foundry/.terraform.lock.hcl') }}

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Check infra/bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Check infra/foundry
        working-directory: infra/foundry
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  python-eval:
    # The evaluation package's tests: recorded transcripts and a fake evals client, no Azure.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - run: python -m pip install -r eval/requirements.txt

      - run: python -m pytest eval/tests -q
